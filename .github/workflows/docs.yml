name: Documentation Guardrails

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/**'
      - '**.py'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/**'
      - '**.py'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Run markdownlint
        run: npm run lint:md

  instruction-file-length:
    name: Instruction File Length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Warn when AGENTS.md or CLAUDE.md is over 200 lines
        run: |
          for f in AGENTS.md CLAUDE.md; do
            lines=$(wc -l < "$f")
            echo "$f: $lines lines"
            if [ "$lines" -gt 200 ]; then
              echo "::warning file=$f::$f is $lines lines (warning threshold: 200). Prune rules that no longer change behaviour or move content to linked docs."
            fi
          done
          exit 0

  link-integrity:
    name: Link Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal markdown links and anchors resolve
        run: python3 scripts/check-doc-links.py .

  doc-reachability:
    name: Doc Reachability from AGENTS.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all docs are reachable from AGENTS.md
        run: |
          # Collect all markdown files in docs/
          all_docs=$(find docs -name '*.md' | sort)

          # Collect all files referenced from AGENTS.md (@ syntax and markdown links)
          referenced=$(grep -oP '(?:@|]\()\.?/?docs/[^)\s]+\.md' AGENTS.md | sed 's/^@//' | sed 's/^](//' | sed 's/^(//' | sort -u)

          orphans=0
          for doc in $all_docs; do
            # Normalize path (strip leading ./)
            doc_clean="${doc#./}"
            if ! echo "$referenced" | grep -qF "$doc_clean"; then
              echo "::warning file=$doc_clean::Orphaned doc: $doc_clean is not referenced from AGENTS.md"
              orphans=$((orphans + 1))
            fi
          done

          if [ "$orphans" -gt 0 ]; then
            echo "$orphans orphaned doc(s) found. All docs should be reachable from AGENTS.md."
            echo "This is a warning, not a failure - add links to AGENTS.md or delete orphaned files."
          fi
          echo "Reachability check complete."

  writing-conventions:
    name: Writing Conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for filler words in docs
        run: |
          # AGENTS.md writing rule: "No filler (basically, just, simply)"
          warnings=0

          while IFS= read -r file; do
            # Skip code blocks by filtering out lines between ``` markers
            # Check for filler words (case-insensitive, whole words only)
            results=$(sed '/^```/,/^```/d' "$file" | grep -inP '\b(basically|simply)\b' || true)
            if [ -n "$results" ]; then
              while IFS= read -r match; do
                echo "::warning file=$file::Filler word found: $match"
                warnings=$((warnings + 1))
              done <<< "$results"
            fi
          done < <(find docs -name '*.md')

          if [ "$warnings" -gt 0 ]; then
            echo "$warnings filler word(s) found. Per AGENTS.md: 'No filler (basically, just, simply)'"
            echo "This is a warning - review and remove where possible."
          fi
          echo "Writing conventions check complete."
