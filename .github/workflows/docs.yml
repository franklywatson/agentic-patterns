name: Documentation Guardrails

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/**'
      - '**.py'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - '.github/workflows/docs.yml'
      - '.autonomy.yaml'
      - 'examples/autonomy/**'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/**'
      - '**.py'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - '.github/workflows/docs.yml'
      - '.autonomy.yaml'
      - 'examples/autonomy/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Run markdownlint
        run: npm run lint:md

  instruction-file-length:
    name: Instruction File Length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Warn when AGENTS.md or CLAUDE.md is over 200 lines
        run: |
          for f in AGENTS.md CLAUDE.md; do
            lines=$(wc -l < "$f")
            echo "$f: $lines lines"
            if [ "$lines" -gt 200 ]; then
              echo "::warning file=$f::$f is $lines lines (warning threshold: 200). Prune rules that no longer change behaviour or move content to linked docs."
            fi
          done
          exit 0

  link-integrity:
    name: Link Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal markdown links and anchors resolve
        run: python3 scripts/check-doc-links.py .

  doc-reachability:
    name: Doc Reachability from AGENTS.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all docs are reachable from AGENTS.md by following links
        run: python3 scripts/check-doc-reachability.py .

  source-ids:
    name: Source IDs Resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every cited source ID has a row in docs/references/sources.md
        run: python3 scripts/sourcecheck.py .

  doc-freshness:
    name: Doc Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Warn at 90 days and fail at 180 days since a pattern doc was reviewed
        run: python3 scripts/check-doc-freshness.py .

      - name: Run the freshness check tests
        run: python3 -m unittest discover -s scripts/tests

  autonomy-check:
    name: Autonomy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the autonomy CLI
        working-directory: examples/autonomy/typescript
        run: |
          npm ci
          npm run build

      - name: Compute the census profile
        run: node examples/autonomy/typescript/dist/src/cli.js census --dir .

      - name: Check the register against the cap and the pull request commits
        run: |
          autonomy() { node examples/autonomy/typescript/dist/src/cli.js "$@"; }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            autonomy check --dir . --git-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            autonomy check --dir . --no-commits
          fi

  writing-conventions:
    name: Writing Conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for filler words in docs
        run: |
          # AGENTS.md writing rule: "No filler (basically, just, simply)"
          warnings=0

          while IFS= read -r file; do
            # Skip code blocks by filtering out lines between ``` markers
            # Check for filler words (case-insensitive, whole words only)
            results=$(sed '/^```/,/^```/d' "$file" | grep -inP '\b(basically|simply)\b' || true)
            if [ -n "$results" ]; then
              while IFS= read -r match; do
                echo "::warning file=$file::Filler word found: $match"
                warnings=$((warnings + 1))
              done <<< "$results"
            fi
          done < <(find docs -name '*.md')

          if [ "$warnings" -gt 0 ]; then
            echo "$warnings filler word(s) found. Per AGENTS.md: 'No filler (basically, just, simply)'"
            echo "This is a warning - review and remove where possible."
          fi
          echo "Writing conventions check complete."
