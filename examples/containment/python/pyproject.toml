[project]
name = "containment-example"
version = "0.1.0"
description = "Policy layer and container boundary, with tests showing which one is the control"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]
